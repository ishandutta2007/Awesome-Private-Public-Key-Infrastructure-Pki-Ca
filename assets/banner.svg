<svg fill="none" viewBox="0 0 800 200" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.5" flood-color="#000000"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  
  <!-- Dynamic Background Grid / Wave Animation Elements -->
  <g opacity="0.15">
    <circle cx="100" cy="40" r="80" fill="#6366f1">
      <animate attributeName="r" values="70;90;70" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="160" r="110" fill="#a855f7">
      <animate attributeName="r" values="100;120;100" dur="8s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,150 Q200,100 400,150 T800,150" stroke="url(#glow)" stroke-width="2" fill="none">
      <animate attributeName="d" values="M0,150 Q200,100 400,150 T800,150; M0,150 Q200,180 400,120 T800,150; M0,150 Q200,100 400,150 T800,150" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Security Lock Icon SVG Graphic -->
  <g transform="translate(45, 45)" filter="url(#shadow)">
    <rect x="10" y="45" width="90" height="70" rx="10" fill="url(#glow)" />
    <path d="M25 45 V 30 A 30 30 0 0 1 85 30 V 45" fill="none" stroke="#e0e7ff" stroke-width="12" stroke-linecap="round"/>
    <circle cx="55" cy="73" r="8" fill="#0f172a"/>
    <path d="M55 78 V 95" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Foreground Title and Subtitle -->
  <g transform="translate(170, 0)">
    <text x="0" y="82" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="0.5" filter="url(#shadow)">
      Awesome Private &amp; Public Key Infrastructure
    </text>
    
    <text x="0" y="115" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="1.5">
      PKI / CA / TLS / mTLS ECOSYSTEM &amp; SECURITY TOOLKIT
    </text>
    
    <!-- Dynamic Pulsing Subtitle Badge -->
    <rect x="0" y="132" width="460" height="28" rx="6" fill="#1e293b" opacity="0.8"/>
    <text x="12" y="151" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="12">
      🔒 Certificate Authorities • Machine Identity • X.509 Automation
    </text>
  </g>
</svg>
